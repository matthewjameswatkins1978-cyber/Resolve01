[package]
name = "resolve-transport"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
resolve-core = { version = "0.1.0", path = "../resolve-core" }
resolve-store = { version = "0.1.0", path = "../resolve-store" }
serde = "1"
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
